<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fast HTML MCP — Live Template Playground</title>
<link rel="stylesheet" href="playground.css">
</head>
<body>
<div class="app-container">
  <header class="app-header">
    <div class="header-left">
      <h1 class="header-title">Fast HTML MCP</h1>
      <span class="header-badge">Live Playground</span>
    </div>
    <div class="header-right">
      <span class="header-status" id="status-indicator">
        <span class="status-dot offline"></span>
        <span class="status-text">Offline Mode</span>
      </span>
      <a href="https://github.com/Aimino-Tech/fast-html-mcp" target="_blank" class="header-link">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
      </a>
    </div>
  </header>
  <div class="playground-layout">
    <div class="editor-panel">
      <div class="panel-header">
        <label class="template-selector">
          <span class="selector-label">Template</span>
          <select id="template-select" class="template-select"></select>
        </label>
      </div>
      <div id="editor-container" class="editor-container"></div>
      <div class="editor-toolbar">
        <button id="btn-reset" class="toolbar-btn" title="Reset to default JSON">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 005.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 013.51 15"/></svg>
          Reset
        </button>
        <button id="btn-copy" class="toolbar-btn" title="Copy JSON to clipboard">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
          Copy JSON
        </button>
        <button id="btn-download" class="toolbar-btn" title="Download rendered HTML">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Download HTML
        </button>
      </div>
    </div>
    <div class="preview-panel">
      <div class="preview-tabs">
        <button class="preview-tab active" data-tab="preview">Preview</button>
        <button class="preview-tab" data-tab="explorer">Component Explorer</button>
      </div>
      <div class="preview-content">
        <div class="preview-view active" id="preview-view">
          <iframe id="preview-iframe" class="preview-iframe" sandbox="allow-scripts" title="Preview"></iframe>
        </div>
        <div class="preview-view" id="explorer-view">
          <div class="explorer-controls">
            <input type="text" id="explorer-search" class="explorer-search" placeholder="Search components...">
            <div class="explorer-filters" id="explorer-filters">
              <button class="filter-btn active" data-category="all">All</button>
              <button class="filter-btn" data-category="layout">Layout</button>
              <button class="filter-btn" data-category="interactive">Interactive</button>
              <button class="filter-btn" data-category="data">Data</button>
              <button class="filter-btn" data-category="media">Media</button>
              <button class="filter-btn" data-category="utility">Utility</button>
            </div>
          </div>
          <div class="explorer-grid" id="explorer-grid"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/dot@1.1.3/doT.min.js"></script>
<script src="playground.js"></script>
</body>
</html>
