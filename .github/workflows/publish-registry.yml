name: Publish to MCP Registry

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Download mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/download/v1.7.9/mcp-publisher_linux_amd64.tar.gz" -o /tmp/mcp-publisher.tar.gz
          tar xzf /tmp/mcp-publisher.tar.gz -C /tmp
          sudo mv /tmp/mcp-publisher /usr/local/bin/
      - name: Authenticate with MCP Registry
        run: mcp-publisher login github-oidc
      - name: Validate server.json
        run: mcp-publisher validate server.json
      - name: Publish to MCP Registry
        run: mcp-publisher publish server.json
